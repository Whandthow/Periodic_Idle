# Копія конфігурації системного Nginx на VM (/etc/nginx/sites-available/marchenko.conf).
# Сертифікати (*.pem) сюди НЕ потрапляють — вони лежать лише на VM у /etc/nginx/certs/.
# 7777 — опублікований порт контейнера client (docker-compose.yml).

# HTTP: тільки переспрямовує на HTTPS
server {
    listen 80;
    server_name marchenko.deploy.local;
    return 301 https://$host$request_uri;
}

# HTTPS: обслуговує застосунок
server {
    listen 443 ssl;
    server_name marchenko.deploy.local;

    ssl_certificate     /etc/nginx/certs/marchenko.deploy.local.pem;
    ssl_certificate_key /etc/nginx/certs/marchenko.deploy.local-key.pem;

    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/marchenko-access.log;
    error_log  /var/log/nginx/marchenko-error.log;
}
