server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Стискаємо текстові відповіді перед відправкою
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Статика (css/js/img): кешуємо на годину. Імена файлів не містять хешу,
    # тому довший кеш показував би гравцям стару версію після оновлення
    location ~* ^/(css|js|img)/ {
        expires 1h;
        try_files $uri =404;
    }

    # Запити /api/... передаємо на бекенд. Без слеша в кінці proxy_pass —
    # префікс /api зберігається, бо Spring-контролери самі слухають /api/...
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Не даємо повільному бекенду тримати з'єднання клієнта вічно
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Усе інше: файли сторінки; якщо файла немає, віддаємо index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
