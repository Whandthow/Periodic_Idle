stages:
  - build
  - deploy

variables:
  SERVER_IMAGE: $CI_REGISTRY_IMAGE:server-$CI_COMMIT_SHORT_SHA
  SERVER_IMAGE_LATEST: $CI_REGISTRY_IMAGE:server-latest
  CLIENT_IMAGE: $CI_REGISTRY_IMAGE:client-$CI_COMMIT_SHORT_SHA
  CLIENT_IMAGE_LATEST: $CI_REGISTRY_IMAGE:client-latest

build-server:
  stage: build
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker build -f server/Dockerfile --build-arg APP_VERSION=$CI_COMMIT_SHORT_SHA -t $SERVER_IMAGE -t $SERVER_IMAGE_LATEST .
    - docker push $SERVER_IMAGE
    - docker push $SERVER_IMAGE_LATEST
    - docker logout $CI_REGISTRY
  only:
    - main

build-client:
  stage: build
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker build -t $CLIENT_IMAGE -t $CLIENT_IMAGE_LATEST ./client
    - docker push $CLIENT_IMAGE
    - docker push $CLIENT_IMAGE_LATEST
    - docker logout $CI_REGISTRY
  only:
    - main

deploy:
  stage: deploy
  # Ручний запуск, поки в проєкті нема Maintainer-доступу для CI/CD Variables
  # (DB_USER/DB_PASSWORD). Прибрати `when: manual`, щойно їх буде додано —
  # тоді деплой знову піде автоматично при кожному push у main.
  when: manual
  script:
    # .env читається docker-compose.yml (DB_USER/DB_PASSWORD) — тут генерується
    # з захищених/замаскованих CI/CD variables проєкту, не з файлу в репо.
    - echo "DB_USER=$DB_USER" > .env
    - echo "DB_PASSWORD=$DB_PASSWORD" >> .env
    - echo "CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE" >> .env
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker compose pull
    - docker compose up -d
    - docker logout $CI_REGISTRY
  only:
    - main
